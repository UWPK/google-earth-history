name: Windows and macOS installation
on: [push, pull_request, workflow_dispatch]
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test setup behavior
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Install and verify real runtime
        run: python scripts/setup.py
      - name: Verify repeat setup reuses the existing runtime
        run: python scripts/setup.py
